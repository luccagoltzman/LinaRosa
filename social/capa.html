<!doctype html>
<!--
  Arte da capa de compartilhamento (WhatsApp, Instagram, Facebook...).
  Gera assets/capa.jpg em 1200×630. Para regenerar, veja o README.
-->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Capa · Lina Rosa 85 anos</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,300;1,400&family=Jost:wght@400&family=Pinyon+Script&display=block" rel="stylesheet">
<link rel="stylesheet" href="../css/base.css">
<style>
  html, body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
  }

  .cover {
    position: relative;
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background:
      radial-gradient(ellipse 60% 70% at 50% 50%, var(--paper) 0%, var(--cream) 70%);
  }

  .flower {
    position: absolute;
    mix-blend-mode: multiply;
  }

  .flower--tl {
    top: -70px;
    left: -110px;
    width: 640px;
    -webkit-mask-image: radial-gradient(ellipse 72% 72% at 25% 25%, #000 55%, transparent 100%);
  }

  .flower--br {
    right: -120px;
    bottom: -90px;
    width: 600px;
    -webkit-mask-image: radial-gradient(ellipse 78% 78% at 70% 70%, #000 50%, transparent 100%);
  }

  .frame {
    position: absolute;
    inset: 22px;
    border: 1px solid var(--line);
  }

  .frame::before {
    content: "";
    position: absolute;
    inset: 7px;
    border: 1px solid rgba(184, 154, 106, .25);
  }

  .content {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding-top: 6px;
  }

  .eyebrow {
    font-size: 15px;
    letter-spacing: .42em;
  }

  .name {
    margin-top: 2px;
    font-family: var(--script);
    font-weight: 400;
    font-size: 172px;
    line-height: 1.05;
    color: var(--rose);
  }

  .age {
    margin-top: -34px;
    font-style: italic;
    font-weight: 300;
    color: var(--olive);
  }

  .age b {
    font-weight: 300;
    font-size: 76px;
  }

  .age span {
    font-size: 52px;
  }

  .ornament {
    display: flex;
    align-items: center;
    gap: 14px;
    margin: 18px 0 16px;
    color: var(--gold);
  }

  .ornament i {
    width: 90px;
    height: 1px;
    background: currentColor;
  }

  .ornament svg {
    width: 12px;
    height: 12px;
  }

  .details {
    font-size: 30px;
    font-weight: 500;
    color: var(--wine);
  }

  .details em {
    font-weight: 400;
    color: var(--ink);
  }
</style>
</head>
<body>
  <div class="cover">
    <img class="flower flower--tl" src="../assets/buque-b.webp" alt="">
    <img class="flower flower--br" src="../assets/buque-a.webp" alt="">
    <div class="frame"></div>

    <div class="content">
      <span class="eyebrow">Você está convidado</span>
      <h1 class="name">Lina Rosa</h1>
      <p class="age"><b>85</b> <span>anos</span></p>
      <div class="ornament">
        <i></i>
        <svg viewBox="0 0 12 12" fill="none" stroke="currentColor"><path d="M6 .8 11.2 6 6 11.2.8 6Z"/></svg>
        <i></i>
      </div>
      <p class="details">14 de dezembro · 19h30 <em>· Terraço Morinda</em></p>
    </div>
  </div>
</body>
</html>
